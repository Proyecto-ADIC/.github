<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400"
     role="img" aria-label="ADIC – Arquitectura del Sistema">

  <defs>
    <style>
      text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    </style>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto">
      <path d="M0,0.5 L0,5.5 L5.5,3 z" fill="#3D4A5C"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="400" fill="#0D1117" rx="8"/>


  <!-- ════════════════════════════════════════════
       LAYER 1 — CLIENTES
  ════════════════════════════════════════════ -->

  <text x="14" y="22" font-size="8.5" font-weight="600" letter-spacing="0.14em" fill="#484F58">CLIENTES</text>

  <!-- Backoffice Admin (x=30, y=30, w=264, h=70) -->
  <rect x="30" y="30" width="264" height="70" rx="4" fill="#161B22" stroke="#2D333B" stroke-width="1"/>
  <text x="162" y="58" text-anchor="middle" font-size="11" font-weight="600" fill="#C9D1D9">Backoffice Admin</text>
  <text x="162" y="77" text-anchor="middle" font-size="9" fill="#6E7681">Portal administrativo, reportes y gestión de usuarios</text>

  <!-- Web Pública (x=328, y=30, w=264, h=70) -->
  <rect x="328" y="30" width="264" height="70" rx="4" fill="#161B22" stroke="#2D333B" stroke-width="1"/>
  <text x="460" y="58" text-anchor="middle" font-size="11" font-weight="600" fill="#C9D1D9">Web Pública</text>
  <text x="460" y="77" text-anchor="middle" font-size="9" fill="#6E7681">Sitio web con calendario de eventos y resultados</text>

  <!-- PWA Árbitros (x=626, y=30, w=264, h=70) -->
  <rect x="626" y="30" width="264" height="70" rx="4" fill="#161B22" stroke="#2D333B" stroke-width="1"/>
  <text x="758" y="58" text-anchor="middle" font-size="11" font-weight="600" fill="#C9D1D9">PWA Árbitros</text>
  <text x="758" y="77" text-anchor="middle" font-size="9" fill="#6E7681">Aplicación offline para carga de puntajes</text>


  <!-- ── Conectores: Clientes → API ── -->
  <path d="M162,100 L162,124 L316,124 L316,166" stroke="#2D333B" stroke-width="1" fill="none" marker-end="url(#arr)"/>
  <path d="M460,100 L460,166"                    stroke="#2D333B" stroke-width="1" fill="none" marker-end="url(#arr)"/>
  <path d="M758,100 L758,124 L604,124 L604,166"  stroke="#2D333B" stroke-width="1" fill="none" marker-end="url(#arr)"/>


  <!-- ════════════════════════════════════════════
       LAYER 2 — BACKEND
  ════════════════════════════════════════════ -->

  <text x="14" y="156" font-size="8.5" font-weight="600" letter-spacing="0.14em" fill="#484F58">BACKEND</text>

  <!-- NestJS API (x=196, y=168, w=528, h=72) — single accent border -->
  <rect x="196" y="168" width="528" height="72" rx="4" fill="#161B22" stroke="#1E5FA0" stroke-width="1.5"/>
  <text x="460" y="197" text-anchor="middle" font-size="12" font-weight="600" fill="#C9D1D9">API REST (NestJS)</text>
  <text x="460" y="216" text-anchor="middle" font-size="9" fill="#6E7681">Lógica de negocio, autenticación y acceso a datos</text>
  <text x="460" y="231" text-anchor="middle" font-size="8.5" fill="#484F58">NestJS 11 · TypeORM · Keycloak Guard · AWS S3 Service</text>


  <!-- ── Conectores: API → Infraestructura ── -->
  <path d="M316,240 L316,260 L162,260 L162,302" stroke="#2D333B" stroke-width="1" fill="none" marker-end="url(#arr)"/>
  <path d="M460,240 L460,302"                    stroke="#2D333B" stroke-width="1" fill="none" marker-end="url(#arr)"/>
  <path d="M604,240 L604,260 L758,260 L758,302"  stroke="#2D333B" stroke-width="1" fill="none" marker-end="url(#arr)"/>


  <!-- ════════════════════════════════════════════
       LAYER 3 — INFRAESTRUCTURA Y SERVICIOS
  ════════════════════════════════════════════ -->

  <text x="14" y="292" font-size="8.5" font-weight="600" letter-spacing="0.14em" fill="#484F58">INFRAESTRUCTURA Y SERVICIOS</text>

  <!-- PostgreSQL (x=30, y=304, w=264, h=70) -->
  <rect x="30" y="304" width="264" height="70" rx="4" fill="#161B22" stroke="#2D333B" stroke-width="1"/>
  <text x="162" y="332" text-anchor="middle" font-size="11" font-weight="600" fill="#C9D1D9">PostgreSQL</text>
  <text x="162" y="351" text-anchor="middle" font-size="9" fill="#6E7681">Base de datos relacional</text>

  <!-- AWS S3 · CloudFront (x=328, y=304, w=264, h=70) -->
  <rect x="328" y="304" width="264" height="70" rx="4" fill="#161B22" stroke="#2D333B" stroke-width="1"/>
  <text x="460" y="332" text-anchor="middle" font-size="11" font-weight="600" fill="#C9D1D9">AWS S3 · CloudFront</text>
  <text x="460" y="351" text-anchor="middle" font-size="9" fill="#6E7681">Almacenamiento multimedia y distribución CDN</text>

  <!-- Keycloak (x=626, y=304, w=264, h=70) -->
  <rect x="626" y="304" width="264" height="70" rx="4" fill="#161B22" stroke="#2D333B" stroke-width="1"/>
  <text x="758" y="332" text-anchor="middle" font-size="11" font-weight="600" fill="#C9D1D9">Keycloak</text>
  <text x="758" y="351" text-anchor="middle" font-size="9" fill="#6E7681">Gestión de identidad y autorización</text>


  <!-- ── Footer ── -->
  <line x1="14" y1="390" x2="906" y2="390" stroke="#21262D" stroke-width="1"/>
  <text x="460" y="398" text-anchor="middle" font-size="7.5" fill="#484F58" letter-spacing="0.06em">Universidad Católica del Uruguay · Proyecto de Grado 2026</text>

</svg>
